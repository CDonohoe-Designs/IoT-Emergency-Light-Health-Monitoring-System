; PlatformIO Project Configuration File
;
; Emergency Light Health Monitor - portfolio firmware
;
; I kept this project on the Arduino framework because that is what I
; originally used for the ESP32 prototype.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    claws/BH1750@^1.2.0
    vshymanskyy/TinyGSM@^0.11.4
    openslab-osu/SSLClient@^1.6.11
    knolleary/PubSubClient@^2.8

build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
